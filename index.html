<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosacruz</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#101215;--panel:#171a1e;--line:#2a2f35;--tx:#d9d4c7;--mut:#8b8a85;--rose:#b5334a;--brass:#b8a06a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Barlow,system-ui,sans-serif;min-height:100vh;
background-image:radial-gradient(ellipse at 50% -10%,#2a1219 0,transparent 55%)}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;margin:0}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,textarea{background:#0b0c0e;border:1px solid var(--line);border-radius:3px;padding:7px 9px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--rose);outline-offset:1px}
button{background:var(--rose);border:0;border-radius:3px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;border:1px solid var(--line)}
button:hover{filter:brightness(1.15)}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:24px}
.logo{font-size:30px;letter-spacing:.04em}.logo i{color:var(--rose);font-style:normal}
.login{max-width:340px;margin:12vh auto;text-align:center}
.login h1{font-size:64px;line-height:1}.login p{color:var(--mut)}
.login input{margin:6px 0}.login .row{display:flex;gap:8px;margin-top:10px}.login .row button{flex:1}
.err{color:#e8798c;min-height:22px;font-size:13px}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:40px}
.door{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--rose);padding:34px 22px;text-align:left;border-radius:3px}
.door h2{font-size:30px}.door span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;cursor:pointer;overflow:hidden;position:relative}
.card .ph{aspect-ratio:3/4;background:#0b0c0e center/cover;display:grid;place-items:center;color:var(--mut);font-size:40px}
.card b{display:block;padding:9px 11px;font-family:'Cormorant Garamond',serif;font-size:19px}
.card .x{position:absolute;top:6px;right:6px;padding:2px 8px;background:#000a}
.card.new{display:grid;place-items:center;min-height:200px;border-style:dashed;color:var(--mut)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border-radius:0;border-bottom:2px solid transparent;color:var(--mut)}
.tabs button.on{color:var(--tx);border-color:var(--rose)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px;margin-bottom:16px}
.box h3{font-size:22px;color:var(--brass);margin-bottom:10px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.f label,.l{display:block;font-size:12px;color:var(--mut)}
.photo{aspect-ratio:3/4;background:#0b0c0e center/cover;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;color:var(--mut);text-align:center}
.xpbar{height:6px;background:#0b0c0e;margin-top:6px}.xpbar i{display:block;height:100%;background:var(--rose)}
.attr{display:grid;grid-template-columns:1fr 70px;gap:6px;align-items:center;margin-bottom:6px}
.big{font-family:'Cormorant Garamond',serif;font-size:34px;line-height:1}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.st div{border:1px solid var(--line);padding:10px;text-align:center}
table{width:100%;border-collapse:collapse}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:center;font-weight:400}
th{color:var(--mut);font-size:12px}
.neg{color:#ff6b81}
.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 18px}
.sk div{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center}
.ok{color:var(--brass)}
.item{display:grid;grid-template-columns:2fr 70px 3fr auto;gap:8px;margin-bottom:8px}
.item.p{grid-template-columns:1fr 3fr auto}
@media(max-width:700px){.item,.item.p{grid-template-columns:1fr}}
textarea.auto{min-height:60vh;resize:none;overflow:hidden;line-height:1.6}
.sm{padding:3px 9px}
.hide{display:none}

.box{position:relative;background:linear-gradient(180deg,#1b1e23,#14161a);box-shadow:0 10px 28px #0007}
.box::before{content:"";position:absolute;left:-1px;top:-1px;width:20px;height:20px;border-top:2px solid var(--rose);border-left:2px solid var(--rose)}
.box h3{display:flex;align-items:center;gap:12px;font-size:25px;letter-spacing:.03em}
.box h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.hd{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:4px 0 14px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.hd h2{font-size:48px;line-height:1}.hd span{color:var(--brass);font-size:17px}
.photo{border:1px solid var(--brass);box-shadow:0 0 0 4px #0b0c0e,0 0 0 5px var(--line);margin:5px}
.st div{background:#0f1114;border-radius:3px}
.st div:nth-child(1){border-top:2px solid #6f9be0}.st div:nth-child(2){border-top:2px solid var(--brass)}.st div:nth-child(3){border-top:2px solid var(--rose)}
.st .big{font-size:44px}
.bar{height:4px;background:#0b0c0e;margin-top:4px}.bar i{display:block;height:100%;background:var(--rose)}
input[type=number]{text-align:center}
input:hover,textarea:hover{border-color:#3d444c}
.sk div{padding:3px 0;border-bottom:1px dotted var(--line)}
.attr{padding:2px 0;border-bottom:1px dotted var(--line)}
.attr input{font-weight:500}
tbody tr:hover{background:#ffffff06}
textarea.grow{resize:none;overflow:hidden;min-height:38px;line-height:1.5}
.item{align-items:start}
.tabs button{font-family:'Cormorant Garamond',serif;font-size:19px}

.lay{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.lay aside{position:sticky;top:12px}
@media(max-width:860px){.lay{grid-template-columns:1fr}.lay aside{position:static}}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.st label small,td small{color:var(--mut);font-size:11px;display:block}
.cv{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:4px}
.cv span{color:var(--mut);font-size:18px}.cv b{color:var(--tx)}
.cur{font-family:'Cormorant Garamond',serif;font-size:42px;line-height:1;font-weight:700;width:90px;text-align:center;background:transparent;border:0;border-bottom:1px solid var(--line);padding:0}
b.cur{width:auto;border:0}
.hpi{width:70px;font-weight:500}
td .bar{margin:4px auto 0;width:70px}
td input[type=number]{width:70px}
.item textarea,.item input{min-width:0}
textarea{word-break:break-word}
.box{padding:18px}
.f{gap:12px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;padding:0 11px 11px;color:var(--mut);font-size:13px}.meta span:last-child,.meta span:nth-child(4){color:var(--brass)}

@keyframes pisca{0%,100%{opacity:1}50%{opacity:.2}}
tr.blink td{background:#b5334a22}
tr.blink td:first-child,tr.blink input,tr.blink td:nth-child(2){color:#ff4d63;font-weight:700;animation:pisca 1s steps(2,start) infinite}
tr.blink .bar i{background:#ff4d63}
@media(prefers-reduced-motion:reduce){tr.blink *{animation:none!important}}
#pw{display:grid;gap:12px}
#inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.pcard{background:#0f1114;border:1px solid var(--line);border-left:3px solid var(--rose);border-radius:3px;padding:12px;display:grid;gap:8px}
.ph2{display:flex;gap:8px;align-items:center}
.pn{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:2px 0}
.qty{display:flex;align-items:center;gap:6px}.qty input{width:64px;text-align:center}.qty small{color:var(--mut);margin-left:4px}
.pcard textarea{background:#0b0c0e}
.card.lock{cursor:default}.card.lock:hover{filter:none}
.pcard textarea{min-height:150px;font-size:16px;line-height:1.6;padding:10px 12px}
.pcard{padding:16px;gap:10px}
#inv{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.pn{font-size:26px}
textarea.grow,textarea.auto{field-sizing:content;overflow:hidden;box-sizing:border-box}

.sk div{grid-template-columns:1fr 64px 44px}
.st div:nth-child(4){border-top:2px solid #f2c230}
.cv span input{width:56px;font-size:16px;text-align:center}
.rb{padding:2px 7px;font-size:12px;background:transparent;border:1px solid var(--line);color:var(--mut)}
.rb:hover{border-color:var(--rose);color:var(--tx);filter:none}
#dice{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.dtog{box-shadow:0 4px 16px #000a}
.dpan{width:min(370px,calc(100vw - 32px));max-height:72vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--rose);border-radius:3px;box-shadow:0 12px 32px #000c}
.dpan.hide{display:none}
.dh2{display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
.dform{display:grid;grid-template-columns:1fr 80px;gap:6px;padding:0 12px 8px}.dform button{grid-column:1/-1}
.dleg{padding:0 12px 8px;color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px}
#dlog{overflow:auto;padding:0 12px 12px;display:grid;gap:8px}
.rl{background:#0f1114;border-left:3px solid var(--line);padding:8px 10px}
.rw{display:flex;justify-content:space-between;gap:8px}.rw span{color:var(--mut);font-size:12px}
.rd{display:flex;align-items:center;gap:8px;margin-top:6px}
.rd i,.dleg i{font-style:normal;font-weight:700;width:30px;height:30px;display:grid;place-items:center;border-radius:6px}
.dleg i{width:20px;height:20px;font-size:11px}
.dh{background:#f2c230;color:#1a1400}.df{background:#7c4dff;color:#fff}
.rt{margin-left:auto;font-family:'Cormorant Garamond',serif;font-size:28px}
@keyframes rolar{from{transform:rotate(-200deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
#dlog .rl:first-child .rd i{animation:rolar .5s}

.dpan{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);max-height:none;border-radius:0;border-top:0;border-left:2px solid var(--rose)}
#dlog{flex:1;min-height:0}
.dh2 span{display:flex;gap:6px}
.rd2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.dv{display:grid;justify-items:center;gap:3px;padding:8px 4px;border:1px solid var(--line);border-radius:4px;opacity:.65}
.dv small{color:var(--mut);font-size:11px}
.dv.win{opacity:1}.dv.h.win{border-color:#f2c230}.dv.f.win{border-color:#7c4dff}
.dv i{width:38px!important;height:38px!important;font-size:18px}
.rres{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;border-top:1px dotted var(--line);padding-top:6px;color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
/* ======= 1) COLE AQUI A CONFIG DO SEU PROJETO FIREBASE ======= */
const firebaseConfig = {
  apiKey: "AIzaSyCp4UmgBLi48SJ8S1nwdHpR46Nd0zM39hM",
  authDomain: "rosacruz-1ec62.firebaseapp.com",
  projectId: "rosacruz-1ec62",
  appId: "1:490914438648:web:56f1982e30c35ee3248a0d"
};
/* ============================================================== */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,addDoc,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,orderBy,limit,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let user=null, admin=sessionStorage.getItem('adm')==='1';

const SECS={mesa:['Mesa Principal','Os investigadores em campo'],guilda:['Guilda','Organização e seus membros'],npc:['NPCs','Apenas para o mestre']};
const ATTR=[['for','Força'],['con','Constituição'],['tam','Tamanho'],['des','Destreza'],['int','Inteligência'],['pod','Poder'],['car','Carisma']];
const SKILLS=['Investigação','Medicina','Pilotagem','Tecnologia','Persuasão','Atualidades','Tática','Enganação','Intimidação','Prestidigitação','Atletismo','Mecânica','Percepção','Dedução','Ofício','Pesquisa','Furtividade','Fé/Convicção','Ocultismo','Liderança','Diplomacia','Carga','Tolerância','Vontade'];
const MAIN=[['nome','Nome'],['idade','Idade'],['apelido','Apelido'],['nasc','Data de nascimento','date'],['genero','Gênero'],['nac','Nacionalidade'],['funcao','Função'],['subfuncao','SubFunção'],['rank','Rank'],['insc','Número de inscrição'],['prof','Profissão'],['altura','Altura'],['peso','Peso'],['tend','Tendência'],['missoes','Missões feitas','number']];
/* Tabela de vitalidade (CON + TAM): [cabeça, tórax, abdômen, braço, perna] */
const VIT={2:[1,3,2,1,1],3:[2,3,2,1,2],4:[2,4,3,1,2],5:[3,5,4,2,3],6:[3,5,4,2,3],7:[4,6,5,3,4],8:[5,7,6,3,5],9:[5,8,7,4,6],10:[6,9,7,4,6],11:[6,10,8,5,7],12:[7,11,9,5,8],13:[8,12,10,6,9],14:[9,13,11,6,10],15:[10,14,12,7,11],16:[11,15,13,8,12]};
const LIMBS=[['cab','Cabeça',0],['tor','Tórax',1],['abd','Abdômen',2],['bd','Braço direito',3],['be','Braço esquerdo',3],['pd','Perna direita',4],['pe','Perna esquerda',4]];


/* ---------- DADOS 2d12 (esperança + medo) ---------- */
let unsub=null;
const rnd=()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%12+1};
async function rollDice(label,mod,who){
  mod=parseInt(mod)||0;const h=rnd(),f=rnd();
  setPan(true);
  try{await addDoc(collection(db,'rolls'),{uid:user.uid,who:who||localStorage.getItem('nick')||'?',label:label||'Teste',h,f,mod,total:Math.max(h,f)+mod,t:serverTimestamp()})}
  catch(e){alert('Não foi possível registrar a rolagem.')}
}
const setPan=o=>{$('#dpan')?.classList.toggle('hide',!o);const t=$('#dtog');if(t)t.style.display=o?'none':''};
const diceAdmin=()=>{$('#dclr')?.classList.toggle('hide',!admin)};
async function clearRolls(){
  if(!admin||!confirm('Apagar todas as rolagens para todos os jogadores?'))return;
  try{const sn=await getDocs(collection(db,'rolls'));let b=writeBatch(db),c=0;
    for(const d of sn.docs){b.delete(d.ref);if(++c%400===0){await b.commit();b=writeBatch(db)}}
    await b.commit()}catch(e){alert('Não foi possível limpar as rolagens.')}
}
function diceInit(){
  if($('#dice'))return;
  const d=document.createElement('div');d.id='dice';
  d.innerHTML=`<div id="dpan" class="dpan hide"><div class="dh2"><b>Rolagens da mesa</b><span><button class="g sm hide" id="dclr">Limpar</button> <button class="g sm" id="dx">×</button></span></div>
  <div class="dform"><input id="dl" placeholder="Teste (opcional)"><input id="dm" type="number" placeholder="Bônus"><button id="dgo">Rolar 2d12</button></div>
  <div class="dleg"><i class="dh">E</i> Esperança <i class="df">M</i> Medo. O resultado é o maior dado somado ao bônus.</div><div id="dlog"></div></div><button id="dtog" class="dtog">Dados</button>`;
  document.body.appendChild(d);
  $('#dtog').onclick=()=>setPan(true);$('#dx').onclick=()=>setPan(false);$('#dclr').onclick=clearRolls;diceAdmin();
  $('#dgo').onclick=()=>rollDice($('#dl').value,$('#dm').value);
  unsub=onSnapshot(query(collection(db,'rolls'),orderBy('t','desc'),limit(40)),snap=>{
    $('#dlog').innerHTML=snap.docs.map(x=>{const v=x.data({serverTimestamps:'estimate'}),tm=v.t?.toDate?.().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})||'';
      const hv=v.h+v.mod,fv=v.f+v.mod,res=Math.max(hv,fv),w=hv>fv?'Esperança':fv>hv?'Medo':'Empate',sg=v.mod>=0?'+':'−',m=Math.abs(v.mod);
      return `<div class="rl"><div class="rw"><b>${esc(v.who)}</b><span>${esc(v.label)} ${tm}</span></div>
        <div class="rd2"><div class="dv h${hv>=fv?' win':''}"><i class="dh">${v.h}</i><small>Esperança</small><span>${sg} ${m} = <b>${hv}</b></span></div>
        <div class="dv f${fv>=hv?' win':''}"><i class="df">${v.f}</i><small>Medo</small><span>${sg} ${m} = <b>${fv}</b></span></div></div>
        <div class="rres"><span>Resultado (${w})</span><b class="rt">${res}</b></div></div>`}).join('')||'<p class="l">Nenhuma rolagem ainda.</p>'},()=>{});
}
function diceOff(){unsub&&unsub();unsub=null;$('#dice')?.remove()}

/* ---------- AUTH ---------- */
const mail=u=>u.trim().toLowerCase().replace(/[^a-z0-9]/g,'_')+'@rosacruz.app';
function loginView(){
  app.innerHTML=`<div class="login"><h1>Rosa<i style="color:var(--rose);font-style:normal">cruz</i></h1>
  <p>Arquivo de casos e investigadores.</p>
  <input id="u" placeholder="Nome de usuário" autocomplete="username">
  <input id="p" type="password" placeholder="Senha" autocomplete="current-password">
  <div class="err" id="e"></div>
  <div class="row"><button id="in">Entrar</button><button class="g" id="up">Criar conta</button></div></div>`;
  const go=async fn=>{ $('#e').textContent='';
    const u=$('#u').value,p=$('#p').value;
    if(u.trim().length<3||p.length<6) return $('#e').textContent='Usuário com 3+ letras e senha com 6+ caracteres.';
    try{await fn(auth,mail(u),p); localStorage.setItem('nick',u.trim());}
    catch(e){ $('#e').textContent={'auth/email-already-in-use':'Esse usuário já existe.','auth/invalid-credential':'Usuário ou senha incorretos.'}[e.code]||'Erro: '+e.code}};
  $('#in').onclick=()=>go(signInWithEmailAndPassword);
  $('#up').onclick=()=>go(createUserWithEmailAndPassword);
}
onAuthStateChanged(auth,async u=>{user=u;
  if(u){try{admin=(await getDoc(doc(db,'admins',u.uid))).exists()}catch(e){admin=false}
    admin?sessionStorage.setItem('adm','1'):sessionStorage.removeItem('adm'); diceInit(); hub()}
  else{admin=false;diceOff();loginView()}});

/* ---------- ADMIN ---------- */
async function toggleAdmin(){
  const ref=doc(db,'admins',user.uid);
  if(admin){try{await deleteDoc(ref)}catch(e){} admin=false;sessionStorage.removeItem('adm');return hub()}
  const n=prompt('Senha de admin:'); if(n===null) return;
  try{await setDoc(ref,{code:n})}catch(e){return alert('Senha incorreta.')}
  admin=true; sessionStorage.setItem('adm','1'); hub();
}

/* ---------- LAYOUT / HUB / LISTAS ---------- */
const top=(back)=>`<div class="top"><h1 class="logo">Rosa<i>cruz</i></h1><div>
${back?'<button class="g" id="bk">Voltar</button> ':''}
<button class="g" id="adm">${admin?'Sair do modo admin':'Modo admin'}</button>
<button class="g" id="out">Sair (${esc(localStorage.getItem('nick')||'')})</button></div></div>`;
function topBind(back){ $('#adm').onclick=toggleAdmin; $('#out').onclick=()=>signOut(auth); if(back)$('#bk').onclick=back }
function hub(){ diceAdmin();
  app.innerHTML=`<div class="wrap">${top()}<h2>Escolha um arquivo</h2><div class="hub">
  ${Object.entries(SECS).filter(([k])=>k!=='npc'||admin).map(([k,[n,d]])=>`<button class="door" data-s="${k}"><h2>${n}</h2><span>${d}</span></button>`).join('')}</div></div>`;
  topBind(); app.querySelectorAll('.door').forEach(b=>b.onclick=()=>list(b.dataset.s));
}
const summ=(S,sec,owner)=>({sec,owner,nome:S.nome||'',foto:S.foto||'',idade:S.idade||'',rank:S.rank||'',lvl:parseInt(S.lvl)||1,funcao:S.funcao||''});
async function list(sec){
  if(sec==='npc'&&!admin) return hub();
  app.innerHTML=`<div class="wrap">${top(1)}<h2>${SECS[sec][0]}</h2><br><div class="grid" id="g">Carregando…</div></div>`;
  topBind(hub);
  const cs=await getDocs(query(collection(db,'cards'),where('sec','==',sec)));
  const cards=new Map();cs.forEach(d=>cards.set(d.id,d.data()));
  const fs=await getDocs(admin?query(collection(db,'fichas'),where('sec','==',sec)):query(collection(db,'fichas'),where('sec','==',sec),where('owner','==',user.uid)));
  for(const d of fs.docs){const v=d.data(),c=summ(v.s||{},sec,v.owner);if(!cards.has(d.id))await setDoc(doc(db,'cards',d.id),c);cards.set(d.id,c)}
  const g=$('#g'); g.innerHTML='<div class="card new" id="nw"><span>+ Nova ficha</span></div>';
  cards.forEach((v,id)=>{const mine=admin||v.owner===user.uid;
    const c=document.createElement('div');c.className='card'+(mine?'':' lock');
    if(!mine)c.title='Somente visualização';
    c.innerHTML=`<div class="ph" style="${v.foto?`background-image:url(${v.foto})`:''}">${v.foto?'':'?'}</div><b>${esc(v.nome||'Sem nome')}</b><div class="meta"><span>Idade ${esc(v.idade||'-')}</span><span>Rank ${esc(v.rank||'-')}</span><span>Nível ${esc(v.lvl||1)}</span><span>${esc(v.funcao||'Sem função')}</span></div>${mine?'<button class="x" title="Excluir">×</button>':''}`;
    if(mine)c.onclick=()=>sheet(id,sec);
    const x=c.querySelector('.x'); if(x)x.onclick=async e=>{e.stopPropagation();if(confirm('Excluir esta ficha?')){await deleteDoc(doc(db,'fichas',id));await deleteDoc(doc(db,'cards',id));list(sec)}};
    g.appendChild(c)});
  $('#nw').onclick=async()=>{const S0={nome:'Novo personagem',lvl:1,xp:0,a:{},sk:{},cb:{},hp:{},pw:[],inv:[],nt:''};const r=await addDoc(collection(db,'fichas'),{sec,owner:user.uid,s:S0});await setDoc(doc(db,'cards',r.id),summ(S0,sec,user.uid));sheet(r.id,sec)};
}

/* ---------- FICHA ---------- */
async function sheet(id,sec){
  const snap=await getDoc(doc(db,'fichas',id)); const S=snap.data().s;
  S.a=S.a||{};S.sk=S.sk||{};S.cb=S.cb||{};S.hp=S.hp||{};S.pw=S.pw||[];S.inv=S.inv||[];S.lvl=S.lvl||1;S.xp=S.xp||0;if(S.espmax==null)S.espmax=6;if(S.esp==null)S.esp=2;
  const can=admin||snap.data().owner===user.uid;
  const n=v=>parseInt(v)||0, A=k=>n(S.a[k]);
  let t;const save=()=>{clearTimeout(t);t=setTimeout(async()=>{await updateDoc(doc(db,'fichas',id),{s:S});await setDoc(doc(db,'cards',id),summ(S,sec,snap.data().owner))},600)};
  const inp=(path,ph,type)=>`<input data-k="${path}" type="${type||'text'}" value="${esc(path.split('.').reduce((o,k)=>o?.[k],S))}" ${can?'':'disabled'}>`;

  app.innerHTML=`<div class="wrap">${top(1)}
  <div class="hd"><h2 id="hn"></h2><span id="hs"></span><label class="l" style="margin-left:auto">Bônus extra nas rolagens <input id="rbonus" type="number" value="0" style="width:70px"></label></div>
  <div class="tabs">${['Principal','Anotações','Poderes','Inventário'].map((x,i)=>`<button data-t="${i}" class="${i?'':'on'}">${x}</button>`).join('')}</div>

  <div class="tab" data-p="0"><div class="lay"><aside>
    <div class="box"><div class="photo" id="ph">Clique para enviar foto</div><input type="file" id="fi" accept="image/*" class="hide"></div>
    <div class="box"><h3>Atributos</h3><div class="l" style="margin-bottom:8px">Pontos restantes: <b id="pts" class="ok"></b> de 15</div>
      <div class="ag">${ATTR.map(([k,l])=>`<div><label>${l}</label>${inp('a.'+k,'','number')}</div>`).join('')}</div></div>
  </aside><main>
    <div class="box"><h3>Status</h3><div class="st">
      ${[['san','Sanidade','10 + INT + POD'],['ene','Energia','10 + FOR + CON'],['vit','Vitalidade','CON + TAM: soma das partes']].map(([k,l,h])=>`<div><label class="l">${l} <small>${h}</small></label><div class="cv">${k==='vit'?'<b id="vit_c" class="cur"></b>':`<input class="cur" type="number" data-s="${k}" ${can?'':'disabled'}>`}<span>/ <b id="${k}_m"></b></span></div><div class="bar"><i id="${k}_b"></i></div></div>`).join('')}<div><label class="l">Esperança <small>pontos atuais / máximo</small></label><div class="cv"><input class="cur" type="number" data-k="esp" value="${esc(S.esp)}" ${can?'':'disabled'}><span>/ <input type="number" data-k="espmax" value="${esc(S.espmax)}" ${can?'':'disabled'}></span></div><div class="bar"><i id="esp_b" style="background:#f2c230"></i></div></div></div>
      <table><thead><tr><th>Parte do corpo</th><th>Máx</th><th>Atual</th><th></th></tr></thead><tbody>
      ${LIMBS.map(([k,l])=>`<tr><td>${l}</td><td id="hm_${k}"></td><td><input class="hpi" type="number" data-hp="${k}" ${can?'':'disabled'}><div class="bar"><i id="hb_${k}"></i></div></td><td><button class="sm g" data-h="${k}" data-d="1" ${can?'':'disabled'}>−</button> <button class="sm g" data-h="${k}" data-d="-1" ${can?'':'disabled'}>+</button></td></tr>`).join('')}</tbody></table></div>
    <div class="box"><h3>Identificação</h3><div class="f">${MAIN.map(([k,l,t])=>`<div><label>${l}</label>${inp(k,'',t)}</div>`).join('')}
      <div><label>Nível (editável)</label>${inp('lvl','','number')}</div>
      <div><label>XP <span id="xpt"></span></label>${inp('xp','','number')}<div class="xpbar"><i id="xpb"></i></div></div></div></div>
    <div class="box"><h3>Perícias</h3><div class="l" style="margin-bottom:8px">Pontos restantes: <b id="spt" class="ok"></b> (20 + INT)</div>
      <div class="sk">${SKILLS.map(s=>`<div><span>${s}</span>${inp('sk.'+s,'','number')}<button class="rb" data-rl="${s}" data-rk="${s}" title="Rolar 2d12">d12</button></div>`).join('')}</div></div>
    <div class="box"><h3>Combate</h3><div class="f" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))" id="cmb"></div></div>
    <div class="box"><h3>Reações</h3><div class="f" style="max-width:190px;margin-bottom:10px"><div><label>Armadura (entra na CA)</label>${inp('cb.arm','','number')}</div></div>
      <table><thead><tr><th style="text-align:left">Reação</th><th>Base</th><th>Outro</th><th>Total</th></tr></thead><tbody>
      <tr><td style="text-align:left">Esquiva <small>7+DES+CON+Armadura</small></td><td id="r1b"></td><td>${inp('cb.eo','','number')}</td><td class="ok"><b id="r1t"></b> <button class="rb" data-rl="Esquiva" data-rm="r1t" title="Rolar 2d12">d12</button></td></tr>
      <tr><td style="text-align:left">Ler movimentos <small>DES</small></td><td id="r2b"></td><td>${inp('cb.lo','','number')}</td><td class="ok"><b id="r2t"></b> <button class="rb" data-rl="Ler movimentos" data-rm="r2t" title="Rolar 2d12">d12</button></td></tr>
      <tr><td style="text-align:left">Bloqueio <small>CON</small></td><td id="r3b"></td><td>${inp('cb.out','','number')}</td><td class="ok"><b id="r3t"></b> <button class="rb" data-rl="Bloqueio" data-rm="r3t" title="Rolar 2d12">d12</button></td></tr></tbody></table></div>
  </main></div></div>

  <div class="tab hide" data-p="1"><textarea class="auto" data-k="nt" placeholder="Pistas, teorias, nomes, lugares…" ${can?'':'disabled'}>${esc(S.nt)}</textarea></div>
  <div class="tab hide" data-p="2"><div class="box"><h3>Poderes</h3><div id="pw"></div><button id="apw" style="margin-top:12px" ${can?'':'disabled'}>+ Novo poder</button></div></div>
  <div class="tab hide" data-p="3"><div class="box"><h3>Inventário</h3><div id="inv"></div><button id="ainv" style="margin-top:12px" ${can?'':'disabled'}>+ Novo item</button></div></div></div>`;
  topBind(()=>list(sec));

  /* abas */
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    app.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
    app.querySelectorAll('.tab').forEach(p=>p.classList.toggle('hide',p.dataset.p!==b.dataset.t)); grow();growAll()});
  const ta=$('textarea.auto'),FS=CSS.supports('field-sizing','content'),grow=()=>{if(FS){ta.style.height='';return}ta.style.height='auto';ta.style.height=Math.max(ta.scrollHeight+4,window.innerHeight*.6)+'px'};

  /* combate (estrutura) */
  const CB=[['Combate corporal',[['cl','Armas leves','des'],['cm','Armas médias','for'],['cp','Armas pesadas','for'],['cv','Armas variantes',null]]],
    ['Combate à distância',[['dl','Armas leves','des'],['dm','Armas médias','des'],['dp','Armas pesadas','des'],['dv','Armas variantes',null]]],
    ['Combate sobrenatural',[['sr','Ritual','pod'],['si','Invocações','pod'],['sp','Pactos','pod']]]];
  $('#cmb').innerHTML=CB.map(([t,r])=>`<div><h3 style="font-size:18px">${t}</h3>${r.map(([k,l,a])=>`<div class="attr" style="grid-template-columns:1fr 60px 40px 44px"><span>${l}${a?` <small class="l" style="display:inline">(+${a.toUpperCase()}/2)</small>`:''}</span>${inp('cb.'+k,'','number')}<b class="ok" id="t_${k}"></b><button class="rb" data-rl="${t}: ${l}" data-rm="t_${k}" title="Rolar 2d12">d12</button></div>`).join('')}</div>`).join('');

  /* cálculos */
  const hp=()=>{const v=Math.min(16,Math.max(2,A('con')+A('tam')));return VIT[v]};
  function calc(){
    S.lvl=Math.max(1,n(S.lvl));
    $('#hn').textContent=S.nome||'Sem nome';$('#hs').textContent='Nível '+S.lvl+(S.funcao?', '+S.funcao:'');$('#xpt').textContent=`(${n(S.xp)}/${5*S.lvl})`;$('#xpb').style.width=Math.min(100,n(S.xp)/(5*S.lvl)*100)+'%';
    ['san','ene'].forEach(k=>{const m=k==='san'?10+A('int')+A('pod'):10+A('for')+A('con'),c=m-n(S['d'+k]),el=app.querySelector(`[data-s=${k}]`);if(el&&document.activeElement!==el)el.value=c;$('#'+k+'_m').textContent=m;el.classList.toggle('neg',c<0);$('#'+k+'_b').style.width=Math.max(0,Math.min(100,c/m*100))+'%'});
    const used=ATTR.reduce((s,[k])=>s+A(k),0),left=15-used;$('#pts').textContent=left;$('#pts').style.color=left<0?'#ff6b81':'';
    const su=Object.values(S.sk).reduce((s,v)=>s+n(v),0),sl=20+A('int')-su;$('#spt').textContent=sl;$('#spt').style.color=sl<0?'#ff6b81':'';
    const h=hp();let tc=0,tm=0;
    LIMBS.forEach(([k,,i])=>{const cur=h[i]-n(S.hp[k]),e=app.querySelector(`[data-hp=${k}]`);if(document.activeElement!==e)e.value=cur;e.classList.toggle('neg',cur<0);const tr=e.closest('tr');tr.classList.toggle('blink',cur<0);$('#hm_'+k).textContent=h[i];$('#hb_'+k).style.width=Math.max(0,Math.min(100,cur/h[i]*100))+'%';tc+=cur;tm+=h[i]});
    $('#vit_c').textContent=tc;$('#vit_c').classList.toggle('neg',tc<0);$('#vit_m').textContent=tm;$('#vit_b').style.width=Math.max(0,Math.min(100,tc/tm*100))+'%';
    $('#esp_b').style.width=Math.max(0,Math.min(100,n(S.esp)/Math.max(1,n(S.espmax))*100))+'%';
    CB.forEach(([,r])=>r.forEach(([k,,a])=>$('#t_'+k).textContent=n(S.cb[k])+(a?Math.floor(A(a)/2):0)));
    const b1=7+A('des')+A('con')+n(S.cb.arm),b2=A('des'),b3=A('con');
    $('#r1b').textContent=b1;$('#r1t').textContent=b1+n(S.cb.eo);$('#r2b').textContent=b2;$('#r2t').textContent=b2+n(S.cb.lo);$('#r3b').textContent=b3;$('#r3t').textContent=b3+n(S.cb.out);
  }
  /* foto */
  const showPh=()=>{const p=$('#ph');p.style.backgroundImage=S.foto?`url(${S.foto})`:'';p.textContent=S.foto?'':'Clique para enviar foto'};
  showPh();
  if(can){$('#ph').onclick=()=>$('#fi').click();
    $('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,400/Math.max(im.width,im.height));c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.foto=c.toDataURL('image/jpeg',.75);showPh();save()};im.src=URL.createObjectURL(f)}}
  /* listas */
  const gr=e=>{if(FS){e.style.height='';return}e.style.height='auto';e.style.height=(e.scrollHeight+e.offsetHeight-e.clientHeight+2)+'px'};const growAll=()=>app.querySelectorAll('textarea.grow').forEach(gr);
  const lists=()=>{
    const dis=can?'':'disabled';
    $('#pw').innerHTML=S.pw.map((p,i)=>`<div class="pcard"><div class="ph2"><input class="pn" data-l="pw" data-i="${i}" data-f="n" placeholder="Nome do poder" value="${esc(p.n)}" ${dis}><button class="g sm" data-r="pw" data-i="${i}" title="Remover" ${dis}>×</button></div><textarea class="grow" rows="2" data-l="pw" data-i="${i}" data-f="d" placeholder="Descrição, custo, alcance…" ${dis}>${esc(p.d)}</textarea></div>`).join('')||'<p class="l">Nenhum poder ainda.</p>';
    $('#inv').innerHTML=S.inv.map((p,i)=>`<div class="pcard"><div class="ph2"><input class="pn" data-l="inv" data-i="${i}" data-f="n" placeholder="Nome do item" value="${esc(p.n)}" ${dis}><button class="g sm" data-r="inv" data-i="${i}" title="Remover" ${dis}>×</button></div><div class="qty"><button class="g sm" data-q="${i}" data-d="-1" ${dis}>−</button><input type="number" data-l="inv" data-i="${i}" data-f="q" value="${esc(p.q)}" ${dis}><button class="g sm" data-q="${i}" data-d="1" ${dis}>+</button><small>quantidade</small></div><textarea class="grow" rows="2" data-l="inv" data-i="${i}" data-f="d" placeholder="Descrição, peso, efeito…" ${dis}>${esc(p.d)}</textarea></div>`).join('')||'<p class="l" style="grid-column:1/-1">Inventário vazio.</p>';
    app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const it=S.inv[b.dataset.q];it.q=Math.max(0,n(it.q)+n(b.dataset.d));lists();save()});
    growAll();app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S[b.dataset.r].splice(b.dataset.i,1);lists();save()});
  };
  $('#apw').onclick=()=>{S.pw.push({n:'',d:''});lists();save()};
  $('#ainv').onclick=()=>{S.inv.push({n:'',q:1,d:''});lists();save()};
  /* entrada genérica */
  app.firstElementChild.addEventListener('click',e=>{const b=e.target.closest('[data-rl]');if(!b)return;const m=b.dataset.rk!==undefined?n(S.sk[b.dataset.rk]):(parseInt($('#'+b.dataset.rm).textContent)||0);rollDice(b.dataset.rl,m+n($('#rbonus').value),S.nome)});
  app.firstElementChild.addEventListener('input',e=>{const el=e.target;
    if(el.dataset.s){const k=el.dataset.s,m=k==='san'?10+A('int')+A('pod'):10+A('for')+A('con');S['d'+k]=m-n(el.value);calc();save();return}
    if(el.dataset.hp){const i=LIMBS.find(x=>x[0]===el.dataset.hp)[2];S.hp[el.dataset.hp]=hp()[i]-n(el.value);calc();save();return}
    if(el.dataset.l){S[el.dataset.l][el.dataset.i][el.dataset.f]=el.value}
    else if(el.dataset.k){const ks=el.dataset.k.split('.'),last=ks.pop();let o=S;ks.forEach(k=>o=o[k]);o[last]=el.type==='number'?(el.value===''?'':+el.value):el.value;
      if(el.dataset.k==='xp'){S.xp=n(el.value);S.lvl=Math.max(1,n(S.lvl));while(S.xp>=5*S.lvl){S.xp-=5*S.lvl;S.lvl++}app.querySelector('[data-k=xp]').value=S.xp;app.querySelector('[data-k=lvl]').value=S.lvl} if(el.classList.contains('auto'))grow(); else if(el.classList.contains('grow'))gr(el)}
    else return; calc();save()});
  app.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.hp[b.dataset.h]=n(S.hp[b.dataset.h])+n(b.dataset.d);calc();save()});
  window.onresize=growAll;
  lists();calc();
}
</script>
</body>
</html>
